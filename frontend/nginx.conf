server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback: qualquer rota desconhecida serve o index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos que "apontam" para a versão atual do app NÃO podem ser cacheados —
    # nem pelo browser nem pelo Cloudflare. Senão o index.html vem novo mas carrega
    # um main.dart.js velho, travando a versão antiga (bug observado 2026-07-10).
    # O main.dart.js do Flutter NÃO tem hash no nome, então também entra aqui.
    location = /index.html            { add_header Cache-Control "no-store, must-revalidate"; }
    location = /main.dart.js          { add_header Cache-Control "no-store, must-revalidate"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-store, must-revalidate"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store, must-revalidate"; }
    location = /flutter.js            { add_header Cache-Control "no-store, must-revalidate"; }
    location = /version.json          { add_header Cache-Control "no-store, must-revalidate"; }

    # Assets versionados (o Flutter os referencia com hash/AssetManifest) podem
    # ser cacheados por muito tempo com segurança.
    location /assets/    { expires 30d; add_header Cache-Control "public, immutable"; }
    location /canvaskit/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location /icons/     { expires 30d; add_header Cache-Control "public, immutable"; }
}
