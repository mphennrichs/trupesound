<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Core Sound Upload &amp; Config</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#5417cf",
                "background-light": "#f6f6f8",
                "background-dark": "#0c0914",
                "card-dark": "#161121",
                "border-dark": "#2e2938"
              },
              fontFamily: {
                "display": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style type="text/tailwindcss">
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #161121;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #2e2938;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #443c53;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col overflow-hidden relative">
<div class="flex flex-col h-screen overflow-hidden opacity-20 grayscale-[0.8]">
<header class="flex items-center justify-between border-b border-slate-200 dark:border-border-dark px-6 py-3 bg-white dark:bg-background-dark shrink-0">
<div class="flex items-center gap-4">
<div class="size-6 text-primary">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H42V17.3333V30.6667H24V44H6V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em]">Unified Stage Sound Manager</h2>
</div>
</header>
<div class="flex flex-1 overflow-hidden">
<aside class="w-64 border-r border-border-dark bg-background-dark p-4 shrink-0"></aside>
<main class="flex flex-1 overflow-hidden">
<section class="flex-1 border-r border-border-dark bg-background-dark"></section>
<section class="flex-1 bg-[#0f0b18]"></section>
</main>
</div>
</div>
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
<div class="bg-card-dark w-full max-w-2xl rounded-xl border border-border-dark shadow-2xl flex flex-col max-h-[90vh]">
<div class="px-6 py-4 border-b border-border-dark flex items-center justify-between shrink-0">
<div class="flex items-center gap-3 text-white">
<span class="material-symbols-outlined text-primary">cloud_upload</span>
<h3 class="text-lg font-bold">Core Sound Upload &amp; Config</h3>
</div>
<button class="text-slate-500 hover:text-white transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex-1 overflow-y-auto custom-scrollbar p-8 space-y-8">
<div class="border-2 border-dashed border-primary/30 bg-primary/5 rounded-xl p-10 flex flex-col items-center justify-center group hover:border-primary/60 transition-all cursor-pointer">
<div class="w-14 h-14 rounded-full bg-primary/20 flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary text-3xl font-light">upload_file</span>
</div>
<h4 class="text-white font-semibold text-lg mb-1">Drag and drop audio file</h4>
<p class="text-slate-400 text-sm mb-6">WAV, MP3, or AIFF (max 50MB)</p>
<button class="px-6 py-2.5 bg-primary/10 text-primary border border-primary/40 rounded-lg font-bold text-sm hover:bg-primary hover:text-white transition-all">Browse Files</button>
</div>
<div class="grid grid-cols-1 gap-6">
<div class="space-y-2">
<label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sound Name</label>
<input class="w-full bg-background-dark border-border-dark text-white rounded-lg focus:ring-1 focus:ring-primary focus:border-primary placeholder:text-slate-600 h-11" placeholder="e.g. Ambient Rainstorm 01" type="text"/>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Description</label>
<textarea class="w-full bg-background-dark border-border-dark text-white rounded-lg focus:ring-1 focus:ring-primary focus:border-primary placeholder:text-slate-600 resize-none" placeholder="Enter notes for stage crew or sound cues..." rows="3"></textarea>
</div>
<div class="space-y-2">
<label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Category</label>
<div class="relative">
<select class="w-full bg-background-dark border-border-dark text-slate-200 rounded-lg focus:ring-1 focus:ring-primary focus:border-primary appearance-none h-11 px-4">
<option>Effect</option>
<option>Music</option>
<option>Ambient Music</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none">expand_more</span>
</div>
</div>
</div>
</div>
<div class="px-8 py-6 border-t border-border-dark flex items-center justify-between bg-background-dark/30 rounded-b-xl">
<div class="flex items-center gap-2 text-slate-500">
<span class="material-symbols-outlined text-sm">info</span>
<p class="text-xs italic">Files are processed for peak loudness normalization.</p>
</div>
<div class="flex gap-3">
<button class="px-6 py-2.5 rounded-lg text-slate-400 font-bold text-sm hover:text-white hover:bg-white/5 transition-colors">Cancel</button>
<button class="px-8 py-2.5 bg-primary text-white rounded-lg font-bold text-sm hover:bg-primary/90 shadow-lg shadow-primary/20 flex items-center gap-2 transition-all active:scale-95">
<span class="material-symbols-outlined text-sm">library_add</span>
                        Add to Library
                    </button>
</div>
</div>
</div>
</div>
<footer class="fixed bottom-0 left-0 right-0 p-4 bg-background-dark border-t border-border-dark flex items-center justify-between z-0 pointer-events-none opacity-10">
<div class="flex gap-6">
<div class="flex flex-col">
<span class="text-[10px] font-bold text-slate-500 uppercase">CPU Load</span>
<span class="text-xs font-mono text-emerald-500">02%</span>
</div>
</div>
<button class="flex items-center gap-2 bg-red-600/10 text-red-600 px-6 py-2.5 rounded-lg text-xs font-bold border border-red-600/20">
<span class="material-symbols-outlined text-sm">emergency_home</span> PANIC STOP
        </button>
</footer>

</body></html>
