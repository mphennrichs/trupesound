<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Theater Sound Manager Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#5417cf",
                "background-light": "#f6f6f8",
                "background-dark": "#0c0914",
                "card-dark": "#161121",
                "border-dark": "#2e2938"
              },
              fontFamily: {
                "display": ["Inter"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style type="text/tailwindcss">body {
    font-family: "Inter", sans-serif
    }
.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }.theatrical-bg {
    background: radial-gradient(circle at 20% 30%, rgba(84, 23, 207, 0.15) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(84, 23, 207, 0.1) 0%, transparent 40%), linear-gradient(to bottom, #0c0914, #06040a);
    position: relative;
    overflow: hidden
    }
.theatrical-bg::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuDfvp1mBY0V1O1-bg4LKXaEZmRuU2h5jP8gMXTxwNE9yrmSAhjHatiFTtmbQdFqFiMto2tPBq7ucnLAhqCVS-bjeHyM62b9GxxTjDpFDjdPtJ1dcEDSQQd-JvqAU5hU9OivTaDL2OmDeObtw2KhXQim1Shr9psfy20oI9tFVtHbQmykQoZFLuQoqCn_Zr3v83p22ymG8WKdEjOqCaYM9mxj0HsfWjqIcAn3petza0pRkNRiXPfMGtRtzICy3iPtsyOpOIk0DDvRKXir);
    background-size: 400px 80px;
    opacity: 0.3;
    mask-image: linear-gradient(to bottom, transparent, black, transparent)
    }
.login-card {
    backdrop-filter: blur(8px);
    background: rgba(22, 17, 33, 0.8)
    }</style>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen flex flex-col font-display theatrical-bg">
<div class="flex-1 flex flex-col items-center justify-center p-6">
<div class="flex flex-col items-center gap-4 mb-8">
<div class="size-14 text-primary bg-primary/10 p-3 rounded-2xl border border-primary/20 shadow-2xl shadow-primary/20">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M24 4H42V17.3333V30.6667H24V44H6V30.6667V17.3333H24V4Z" fill="currentColor" fill-rule="evenodd"></path>
</svg>
</div>
<div class="text-center">
<h1 class="text-2xl font-bold tracking-tight text-white">Unified Stage Sound Manager</h1>
<p class="text-slate-400 text-sm mt-1 font-medium">Professional Production Audio Control</p>
</div>
</div>
<div class="w-full max-w-md login-card border border-border-dark rounded-2xl p-8 shadow-2xl">
<form class="flex flex-col gap-6" onsubmit="return false;">
<div class="space-y-4">
<div class="space-y-1.5">
<label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1" for="identity">Email or Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl">person</span>
<input class="w-full bg-background-dark/50 border-border-dark rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-600 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="identity" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<div class="flex items-center justify-between ml-1">
<label class="text-xs font-bold text-slate-400 uppercase tracking-wider" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xl">lock</span>
<input class="w-full bg-background-dark/50 border-border-dark rounded-xl pl-11 pr-4 py-3 text-white placeholder-slate-600 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<div class="flex items-center gap-2 px-1">
<input class="size-4 rounded border-border-dark bg-card-dark text-primary focus:ring-primary focus:ring-offset-background-dark" id="remember" type="checkbox"/>
<label class="text-sm text-slate-400 select-none" for="remember">Remember this station</label>
</div>
<button class="w-full py-3.5 bg-primary hover:bg-primary/90 text-white font-bold rounded-xl shadow-lg shadow-primary/25 transition-all flex items-center justify-center gap-2 group" type="submit">
                Sign In
                <span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform">login</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-border-dark/50 text-center">
<p class="text-sm text-slate-400">
                New to the platform? 
                <a class="font-bold text-white hover:text-primary transition-colors ml-1" href="#">Create Account</a>
</p>
</div>
</div>
<div class="mt-12 flex flex-col items-center gap-4">
<div class="flex items-center gap-6 text-[10px] font-bold text-slate-500 uppercase tracking-widest">
<a class="hover:text-slate-300 transition-colors" href="#">Security</a>
<span class="w-1 h-1 bg-slate-700 rounded-full"></span>
<a class="hover:text-slate-300 transition-colors" href="#">Privacy Policy</a>
<span class="w-1 h-1 bg-slate-700 rounded-full"></span>
<a class="hover:text-slate-300 transition-colors" href="#">v2.4.1</a>
</div>
</div>
</div>

</body></html>
